name: Validate HACS

# No build step needed: the repository publishes GitHub releases, so HACS
# validation checks the latest release asset (stack-in-card.js), not the
# working tree.
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
